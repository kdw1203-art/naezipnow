# 합성 모니터링 (#16)
# - 하루 2회(UTC 21시/9시 = KST 06시/18시) 프로덕션 핵심 URL 5개의 200 응답 확인
# - /api/health의 status가 "ok"가 아니면(degraded 포함) 세부 checks를 담아 이슈 생성
# - 같은 제목의 open 이슈가 이미 있으면 중복 생성 스킵
name: Synthetic monitoring

on:
  schedule:
    # [1206] 하루 2회 → 3시간마다 — Vercel 프로젝트 정지(2026-11-21 · 503 DEPLOYMENT_PAUSED)를 사람이 먼저 발견했다
    - cron: "17 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  synthetic:
    runs-on: ubuntu-latest
    steps:
      - name: Probe production URLs
        id: probe
        run: |
          BASE="https://naezipnow.com"
          FAILED=""
          PAUSED=0
          for P in / /notes /town /calculator /api/health; do
            CODE=$(curl -s -o /tmp/probe-body -w "%{http_code}" --max-time 30 --retry 2 --retry-delay 5 "$BASE$P" || echo 000)
            echo "$P -> $CODE"
            # [1206] 정지는 따로 — 본문/헤더에 DEPLOYMENT_PAUSED 가 있으면 코드가 아니라 Vercel 계정(사용량·결제) 문제다
            if [ "$CODE" = "503" ] && grep -q "DEPLOYMENT_PAUSED" /tmp/probe-body 2>/dev/null; then
              PAUSED=1
            fi
            if [ "$CODE" != "200" ]; then
              FAILED="$FAILED $P($CODE)"
            fi
          done

          # /api/health 상태 — "ok"가 아니면(degraded 포함) 문제로 간주
          HEALTH_JSON=$(curl -s --max-time 30 "$BASE/api/health" || echo '{}')
          HEALTH_STATUS=$(printf '%s' "$HEALTH_JSON" | jq -r '.status // "unreachable"' 2>/dev/null || echo "unparseable")
          HEALTH_CHECKS=$(printf '%s' "$HEALTH_JSON" | jq -c '.checks // {}' 2>/dev/null || echo '{}')
          echo "health status: $HEALTH_STATUS"
          echo "health checks: $HEALTH_CHECKS"

          {
            echo "failed=${FAILED# }"
            echo "health_status=$HEALTH_STATUS"
            echo "health_checks=$HEALTH_CHECKS"
            echo "paused=$PAUSED"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$FAILED" ] || [ "$HEALTH_STATUS" != "ok" ]; then
            echo "problem=1" >> "$GITHUB_OUTPUT"
          else
            echo "problem=0" >> "$GITHUB_OUTPUT"
          fi

      - name: Create issue on failure
        if: steps.probe.outputs.problem == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.probe.outputs.failed }}
          HEALTH_STATUS: ${{ steps.probe.outputs.health_status }}
          HEALTH_CHECKS: ${{ steps.probe.outputs.health_checks }}
          PAUSED: ${{ steps.probe.outputs.paused }}
        run: |
          TITLE="Synthetic monitoring failure: naezipnow.com"
          if [ "$PAUSED" = "1" ]; then
            # [1206] 정지는 코드로 못 고친다 — 소유자가 Vercel 대시보드(Usage · Spend Management · Billing)에서 풀어야 한다
            gh api repos/${{ github.repository }}/issues \
              -f title="🚨 Vercel 프로젝트 정지(DEPLOYMENT_PAUSED) — naezipnow.com 전체 503" \
              -f body="$(date -u +%FT%TZ) 합성 점검: 모든 화면이 503 DEPLOYMENT_PAUSED.

          할 일(소유자): Vercel → nuguzip-homepage → Settings/Usage · Spend Management 에서 정지 사유 확인 후 Resume.
          코드 배포로는 풀리지 않습니다. run: ${{ github.run_id }}" || true
          fi
          # 중복 이슈 방지 — 같은 제목의 open 이슈가 있으면 스킵
          EXISTING=$(gh api "repos/${{ github.repository }}/issues?state=open&per_page=100" \
            --jq "[.[] | select(.title == \"$TITLE\")] | length" || echo 0)
          if [ "${EXISTING:-0}" -gt 0 ]; then
            echo "Open issue with same title already exists — skipping"
            exit 0
          fi
          BODY="Synthetic monitoring detected a problem at $(date -u +%FT%TZ) (run: ${{ github.run_id }}).

          - Failed URLs (non-200): ${FAILED:-none}
          - /api/health status: ${HEALTH_STATUS}

          Health checks detail:
          \`\`\`json
          ${HEALTH_CHECKS}
          \`\`\`

          Runbook: docs/runbook.md"
          gh api repos/${{ github.repository }}/issues \
            -f title="$TITLE" -f body="$BODY" || true

      # 정상으로 돌아오면 열려 있던 모니터링 이슈를 자동으로 닫는다(e2e.yml 패턴).
      # 닫는 걸 사람 기억에 맡기면, 복구된 지 오래된 이슈가 열려 있어서
      # 다음 실제 장애가 "이미 열린 이슈가 있음 — 스킵"에 걸려 조용히 묻힌다.
      - name: Close monitoring issue on recovery
        if: steps.probe.outputs.problem == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Synthetic monitoring failure: naezipnow.com"
          for N in $(gh api "repos/${{ github.repository }}/issues?state=open&per_page=100" \
            --jq "[.[] | select(.title == \"$TITLE\")] | .[].number" 2>/dev/null); do
            gh issue close "$N" --repo ${{ github.repository }} \
              --comment "run ${{ github.run_id }} 정상 확인 — 자동 종료" || true
          done
